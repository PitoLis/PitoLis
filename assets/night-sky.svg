<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Pumpkin — night city skyline banner with stars, meteors and a glowing jack-o'-lantern">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10121c"/>
      <stop offset="0.55" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#2f334d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c0caf5" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#c0caf5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#c0caf5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pumpGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9e64" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9e64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meteorTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0caf5" stop-opacity="0"/>
      <stop offset="1" stop-color="#e6e9f0" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="320" fill="url(#nightSky)"/>

  <!-- stars: four groups with staggered twinkle phases -->
  <g fill="#c0caf5">
    <g>
      <circle cx="80" cy="58" r="1.6"/><circle cx="212" cy="132" r="1.2"/><circle cx="338" cy="44" r="1.8"/><circle cx="524" cy="60" r="1.3"/><circle cx="756" cy="52" r="1.6"/><circle cx="944" cy="126" r="1.2"/><circle cx="1128" cy="46" r="1.7"/>
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="146" cy="96" r="1.2"/><circle cx="286" cy="118" r="1.5"/><circle cx="452" cy="36" r="1.2"/><circle cx="662" cy="94" r="1.4"/><circle cx="848" cy="60" r="1.2"/><circle cx="1032" cy="88" r="1.5"/><circle cx="1176" cy="140" r="1.2"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="56" cy="150" r="1.3"/><circle cx="398" cy="88" r="1.2"/><circle cx="578" cy="40" r="1.5"/><circle cx="718" cy="130" r="1.2"/><circle cx="892" cy="98" r="1.4"/><circle cx="1074" cy="62" r="1.2"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="-0.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="176" cy="42" r="1.1"/><circle cx="318" cy="164" r="1.2"/><circle cx="608" cy="128" r="1.1"/><circle cx="806" cy="150" r="1.2"/><circle cx="968" cy="40" r="1.4"/><circle cx="1152" cy="96" r="1.1"/>
      <animate attributeName="opacity" values="1;0.25;1" dur="4.2s" begin="-2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- moon with breathing halo -->
  <g>
    <circle cx="1050" cy="72" r="46" fill="url(#moonGlow)">
      <animate attributeName="r" values="44;54;44" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="72" r="26" fill="#e6e9f0"/>
    <circle cx="1042" cy="64" r="4.5" fill="#c0caf5" opacity="0.5"/>
    <circle cx="1058" cy="82" r="3" fill="#c0caf5" opacity="0.4"/>
    <circle cx="1054" cy="60" r="2.2" fill="#c0caf5" opacity="0.35"/>
  </g>

  <!-- meteors -->
  <g opacity="0">
    <line x1="0" y1="0" x2="100" y2="21.8" stroke="url(#meteorTail)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="100" cy="21.8" r="2.6" fill="#e6e9f0"/>
    <animateMotion path="M120,30 L1300,285" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.1;0.72;1" dur="7s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="70" y2="15.3" stroke="url(#meteorTail)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="70" cy="15.3" r="2" fill="#e6e9f0"/>
    <animateMotion path="M980,20 L1420,120" dur="9s" begin="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.12;0.7;1" dur="9s" begin="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- skyline -->
  <g fill="#0f101a">
    <rect x="0" y="250" width="70" height="70"/>
    <rect x="70" y="270" width="55" height="50"/>
    <rect x="125" y="230" width="80" height="90"/>
    <line x1="165" y1="230" x2="165" y2="212" stroke="#0f101a" stroke-width="3"/>
    <rect x="205" y="265" width="60" height="55"/>
    <rect x="313" y="275" width="70" height="45"/>
    <rect x="383" y="240" width="90" height="80"/>
    <rect x="473" y="280" width="60" height="40"/>
    <rect x="533" y="225" width="75" height="95"/>
    <rect x="608" y="270" width="55" height="50"/>
    <rect x="663" y="235" width="85" height="85"/>
    <rect x="748" y="285" width="65" height="35"/>
    <rect x="871" y="260" width="75" height="60"/>
    <rect x="946" y="245" width="62" height="75"/>
    <rect x="1008" y="272" width="80" height="48"/>
    <rect x="1088" y="232" width="60" height="88"/>
    <rect x="1148" y="268" width="52" height="52"/>
  </g>

  <!-- neon tower (left) with jack-o'-lantern on top -->
  <g>
    <rect x="265" y="215" width="48" height="105" fill="#1f2233" stroke="#f7768e" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(289,196)">
      <animate attributeName="opacity" values="0.88;1;0.88" dur="3s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="2" rx="20" ry="18" fill="url(#pumpGlow)"/>
      <ellipse cx="-13" cy="0" rx="9.5" ry="12.5" fill="#d99a4e"/>
      <ellipse cx="13" cy="0" rx="9.5" ry="12.5" fill="#d99a4e"/>
      <ellipse cx="0" cy="0" rx="12" ry="13.5" fill="#ff9e64"/>
      <path d="M-6,-12 C-8,-4 -8,4 -6,12" fill="none" stroke="#c08040" stroke-width="1.4" opacity="0.6"/>
      <path d="M6,-12 C8,-4 8,4 6,12" fill="none" stroke="#c08040" stroke-width="1.4" opacity="0.6"/>
      <path d="M0,-14 Q3,-22 9,-21" fill="none" stroke="#9ece6a" stroke-width="3" stroke-linecap="round"/>
      <path d="M-9,-2 L-3,-4.5 L-4,3.5 Z" fill="#ffd173"/>
      <path d="M9,-2 L3,-4.5 L4,3.5 Z" fill="#ffd173"/>
      <path d="M-8,5 L-5,9 L-2,5 L1,9 L4,5 L7,9 L7,3.5 L-8,3.5 Z" fill="#ffd173"/>
    </g>
  </g>

  <!-- neon tower (right) -->
  <rect x="813" y="220" width="58" height="100" fill="#1f2233" stroke="#7aa2f7" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <!-- beacon light -->
  <circle cx="570" cy="222" r="2.4" fill="#f7768e">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- lit windows -->
  <g fill="#e0af68">
    <rect x="140" y="244" width="4" height="6"/><rect x="152" y="244" width="4" height="6"/><rect x="164" y="262" width="4" height="6"/><rect x="178" y="244" width="4" height="6"/><rect x="190" y="262" width="4" height="6"/>
    <rect x="400" y="254" width="4" height="6"/><rect x="412" y="254" width="4" height="6"/><rect x="424" y="272" width="4" height="6"/><rect x="448" y="254" width="4" height="6"/><rect x="436" y="236" width="4" height="6"/>
    <rect x="684" y="250" width="4" height="6"/><rect x="696" y="250" width="4" height="6"/><rect x="720" y="268" width="4" height="6"/><rect x="708" y="250" width="4" height="6"/>
    <rect x="1022" y="286" width="4" height="6"/><rect x="1046" y="286" width="4" height="6"/><rect x="1034" y="268" width="4" height="6"/>
    <rect x="962" y="259" width="4" height="6"/><rect x="986" y="259" width="4" height="6"/><rect x="974" y="277" width="4" height="6"/><rect x="940" y="259" width="4" height="6"/>
  </g>
  <!-- windows that flicker -->
  <g fill="#e0af68">
    <rect x="88" y="282" width="4" height="6"/><rect x="102" y="282" width="4" height="6"/><rect x="116" y="296" width="4" height="6"/><rect x="486" y="292" width="4" height="6"/><rect x="498" y="292" width="4" height="6"/>
    <animate attributeName="opacity" values="1;0.15;1" dur="5.2s" repeatCount="indefinite"/>
  </g>
  <g fill="#e0af68">
    <rect x="624" y="282" width="4" height="6"/><rect x="638" y="282" width="4" height="6"/><rect x="1104" y="244" width="4" height="6"/><rect x="1118" y="262" width="4" height="6"/><rect x="1164" y="280" width="4" height="6"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" begin="-1.7s" repeatCount="indefinite"/>
  </g>
  <!-- a few cool blue windows -->
  <g fill="#7aa2f7" opacity="0.85">
    <rect x="828" y="238" width="4" height="6"/><rect x="852" y="238" width="4" height="6"/><rect x="840" y="256" width="4" height="6"/><rect x="278" y="232" width="4" height="6"/><rect x="292" y="250" width="4" height="6"/>
  </g>

  <!-- titles -->
  <g font-family="'JetBrains Mono','Fira Code','Courier New',monospace" text-anchor="middle">
    <text x="600" y="118" font-size="58" font-weight="bold" letter-spacing="14" fill="url(#textGrad)" opacity="0">PUMPKIN
      <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="600" y="156" font-size="17" letter-spacing="2" fill="#9aa5ce" opacity="0">— vision systems · quant scans · on-chain agents —
      <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.8s" fill="freeze"/>
    </text>
  </g>
</svg>
