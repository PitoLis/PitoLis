<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Pumpkin — black-and-gold starfield with meteors, a moon and a floating glowing jack-o'-lantern">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050508"/>
      <stop offset="0.6" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#181206"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#c9971c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0af68" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#e0af68" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#e0af68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pumpGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9e64" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff9e64" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd173" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffd173" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0af68" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#e0af68" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meteorTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0af68" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- deep space -->
  <rect width="1200" height="320" fill="url(#nightSky)"/>
  <ellipse cx="260" cy="140" rx="190" ry="95" fill="url(#nebulaGold)"/>
  <ellipse cx="940" cy="250" rx="210" ry="105" fill="url(#nebulaAmber)"/>

  <!-- stars: four groups with staggered twinkle phases, full sky coverage -->
  <g fill="#ffd173">
    <g>
      <circle cx="80" cy="58" r="1.6"/><circle cx="212" cy="132" r="1.2"/><circle cx="338" cy="44" r="1.8"/><circle cx="524" cy="60" r="1.3"/><circle cx="756" cy="52" r="1.6"/><circle cx="944" cy="126" r="1.2"/><circle cx="1128" cy="46" r="1.7"/>
      <circle cx="150" cy="240" r="1.4"/><circle cx="480" cy="290" r="1.2"/><circle cx="830" cy="262" r="1.5"/><circle cx="1050" cy="210" r="1.2"/>
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="146" cy="96" r="1.2"/><circle cx="286" cy="118" r="1.5"/><circle cx="452" cy="36" r="1.2"/><circle cx="662" cy="94" r="1.4"/><circle cx="848" cy="60" r="1.2"/><circle cx="1032" cy="88" r="1.5"/><circle cx="1176" cy="140" r="1.2"/>
      <circle cx="60" cy="190" r="1.3"/><circle cx="390" cy="300" r="1.2"/><circle cx="720" cy="235" r="1.4"/><circle cx="1140" cy="290" r="1.2"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/>
    </g>
  </g>
  <g fill="#e0af68">
    <g>
      <circle cx="56" cy="150" r="1.3"/><circle cx="398" cy="88" r="1.2"/><circle cx="578" cy="40" r="1.5"/><circle cx="718" cy="130" r="1.2"/><circle cx="892" cy="98" r="1.4"/><circle cx="1074" cy="62" r="1.2"/>
      <circle cx="250" cy="285" r="1.3"/><circle cx="560" cy="225" r="1.2"/><circle cx="940" cy="300" r="1.5"/><circle cx="1190" cy="230" r="1.2"/><circle cx="330" cy="190" r="1.3"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="-0.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="176" cy="42" r="1.1"/><circle cx="318" cy="164" r="1.2"/><circle cx="608" cy="128" r="1.1"/><circle cx="806" cy="150" r="1.2"/><circle cx="968" cy="40" r="1.4"/><circle cx="1152" cy="96" r="1.1"/>
      <circle cx="110" cy="300" r="1.2"/><circle cx="430" cy="250" r="1.3"/><circle cx="700" cy="190" r="1.1"/><circle cx="880" cy="300" r="1.3"/><circle cx="1090" cy="255" r="1.2"/>
      <animate attributeName="opacity" values="1;0.25;1" dur="4.2s" begin="-2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- bright anchor stars with slow pulse -->
  <g fill="#ffe08a">
    <circle cx="240" cy="80" r="2.2"/>
    <circle cx="640" cy="70" r="2"/>
    <circle cx="1000" cy="170" r="2.4"/>
    <circle cx="90" cy="120" r="2"/>
    <circle cx="520" cy="200" r="2.2"/>
    <circle cx="1160" cy="60" r="2"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- moon with breathing halo -->
  <g>
    <circle cx="1050" cy="72" r="46" fill="url(#moonGlow)">
      <animate attributeName="r" values="44;54;44" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="72" r="26" fill="#ffe08a"/>
    <circle cx="1042" cy="64" r="4.5" fill="#d4a017" opacity="0.5"/>
    <circle cx="1058" cy="82" r="3" fill="#d4a017" opacity="0.4"/>
    <circle cx="1054" cy="60" r="2.2" fill="#d4a017" opacity="0.35"/>
  </g>

  <!-- meteors -->
  <g opacity="0">
    <line x1="0" y1="0" x2="100" y2="21.8" stroke="url(#meteorTail)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="100" cy="21.8" r="2.6" fill="#ffe08a"/>
    <animateMotion path="M120,30 L1300,285" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.1;0.72;1" dur="7s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="70" y2="15.3" stroke="url(#meteorTail)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="70" cy="15.3" r="2" fill="#ffe08a"/>
    <animateMotion path="M980,20 L1420,120" dur="9s" begin="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.12;0.7;1" dur="9s" begin="3.2s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="85" y2="18.6" stroke="url(#meteorTail)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="85" cy="18.6" r="2.3" fill="#ffe08a"/>
    <animateMotion path="M60,160 L1240,430" dur="8s" begin="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.1;0.66;1" dur="8s" begin="5.5s" repeatCount="indefinite"/>
  </g>

  <!-- floating jack-o'-lantern -->
  <g transform="translate(600,238) scale(1.25)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="2" rx="24" ry="22" fill="url(#pumpGlow)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-13" cy="0" rx="9.5" ry="12.5" fill="#d99a4e"/>
      <ellipse cx="13" cy="0" rx="9.5" ry="12.5" fill="#d99a4e"/>
      <ellipse cx="0" cy="0" rx="12" ry="13.5" fill="#ff9e64"/>
      <path d="M-6,-12 C-8,-4 -8,4 -6,12" fill="none" stroke="#c08040" stroke-width="1.4" opacity="0.6"/>
      <path d="M6,-12 C8,-4 8,4 6,12" fill="none" stroke="#c08040" stroke-width="1.4" opacity="0.6"/>
      <path d="M0,-14 Q3,-22 9,-21" fill="none" stroke="#9ece6a" stroke-width="3" stroke-linecap="round"/>
      <path d="M-9,-2 L-3,-4.5 L-4,3.5 Z" fill="#ffd173"/>
      <path d="M9,-2 L3,-4.5 L4,3.5 Z" fill="#ffd173"/>
      <path d="M-8,5 L-5,9 L-2,5 L1,9 L4,5 L7,9 L7,3.5 L-8,3.5 Z" fill="#ffd173"/>
    </g>
  </g>

  <!-- titles -->
  <g font-family="'JetBrains Mono','Fira Code','Courier New',monospace" text-anchor="middle">
    <text x="600" y="118" font-size="58" font-weight="bold" letter-spacing="14" fill="url(#textGrad)" opacity="0">PUMPKIN
      <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="600" y="156" font-size="17" letter-spacing="2" fill="#bfa76a" opacity="0">— vision systems · quant scans · on-chain agents —
      <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.8s" fill="freeze"/>
    </text>
  </g>
</svg>
